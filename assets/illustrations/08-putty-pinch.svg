<svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi Realistis Gaya Komik: Mencubit Plastisin Lunak">
  <defs>
    <filter id="shadow08" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#8a3818" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Warm Cream -->
  <rect width="400" height="400" fill="#faede4"/>

  <!-- Meja Garis Dasar -->
  <line x1="20" y1="330" x2="380" y2="330" stroke="#cbd5e1" stroke-width="4"/>
  <ellipse cx="180" cy="332" rx="120" ry="24" fill="#cbb5a4" opacity="0.6"/>

  <!-- Gumpalan Plastisin Biru Tertekan -->
  <g transform="translate(160, 270)">
    <!-- Badan Adonan Bawah -->
    <ellipse cx="20" cy="40" rx="90" ry="28" fill="#0284c7" stroke="#18181b" stroke-width="3"/>
    <ellipse cx="20" cy="38" rx="85" ry="25" fill="#38bdf8"/>
    <!-- Kubah Cubitan Atas -->
    <path d="M -40 40 Q 20 -20 80 40 Z" fill="#60a5fa" stroke="#18181b" stroke-width="3"/>
    <!-- Lekukan Bekas Tekanan Jari -->
    <ellipse cx="20" cy="15" rx="22" ry="10" fill="#0369a1" opacity="0.4"/>
  </g>

  <!-- Tangan Gaya Komik Menjepit Ujung Jari ke Bawah -->
  <g filter="url(#shadow08)">
    <!-- Cel-shading Lengan -->
    <path d="M 390 120 C 350 150, 310 180, 280 205 C 260 220, 240 235, 220 250 L 250 290 C 275 270, 310 240, 350 200 C 380 170, 400 140, 400 120 Z" fill="#d57c4f"/>
    <!-- Kontur Punggung Tangan -->
    <path d="M 380 110 C 330 145, 290 175, 260 200 C 240 215, 220 230, 200 240 C 180 230, 160 240, 150 260 C 145 270, 155 285, 175 285 C 190 285, 205 270, 220 255 C 245 240, 280 205, 320 170 C 350 140, 380 110, 380 110 Z" fill="#f6c49f" stroke="#18181b" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Ibu Jari (Menekan dari Samping Kiri) -->
    <path d="M 140 250 C 130 265, 135 285, 155 285 C 170 285, 175 270, 165 255 C 155 245, 145 245, 140 250 Z" fill="#f6c49f" stroke="#18181b" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="145" cy="275" rx="5" ry="4" fill="#fef3ec" stroke="#18181b" stroke-width="2"/>
    <path d="M 152 262 Q 155 268 152 274" stroke="#18181b" stroke-width="1.8" fill="none"/>

    <!-- Jari Telunjuk (Menekan dari Samping Kanan) -->
    <path d="M 195 245 C 205 260, 200 280, 185 285 C 175 285, 175 270, 180 255 C 185 245, 190 240, 195 245 Z" fill="#f6c49f" stroke="#18181b" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="195" cy="275" rx="5" ry="4" fill="#fef3ec" stroke="#18181b" stroke-width="2"/>
    <path d="M 188 262 Q 185 268 188 274" stroke="#18181b" stroke-width="1.8" fill="none"/>

    <!-- Jari-Jari Lain Mengangkat Sedikit -->
    <path d="M 230 215 C 245 205, 260 215, 250 230 C 240 240, 225 235, 220 225 Z" fill="#f6c49f" stroke="#18181b" stroke-width="2.5"/>
    <path d="M 255 190 C 270 180, 285 190, 275 205 C 265 215, 250 210, 245 200 Z" fill="#f6c49f" stroke="#18181b" stroke-width="2.5"/>

    <!-- Arsiran Komik Realistis -->
    <g stroke="#18181b" stroke-width="1.5" stroke-linecap="round">
      <line x1="285" y1="185" x2="305" y2="195"/>
      <line x1="280" y1="193" x2="300" y2="203"/>
      <line x1="275" y1="201" x2="295" y2="211"/>
      <line x1="330" y1="145" x2="350" y2="160"/>
      <line x1="325" y1="155" x2="345" y2="170"/>
    </g>
  </g>
</svg>
